<!doctype html>
<!-- Stable renderer: loads data-YYYYMMDD.json at runtime. -->
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Daily Report</title>
  <meta name="description" content="Dynamic Daily Report prototype loaded from dated JSON.">
  <style>
    :root {
      --paper: #f4f0e7;
      --paper-2: #ebe5d7;
      --ink: #171716;
      --muted: #756f64;
      --faint: #bcb4a5;
      --rule: #cfc7b8;
      --accent: #a33a2b;
      --accent-2: #d87953;
      --wash: #eee8dc;
      --card: #f9f6ef;
      --shadow: 0 20px 60px rgba(55, 43, 26, .10);
      --serif: Georgia, 'Times New Roman', serif;
      --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    [data-theme="dark"] {
      --paper: #1b1a18;
      --paper-2: #25231f;
      --ink: #f1ebde;
      --muted: #afa594;
      --faint: #6e685e;
      --rule: #464139;
      --accent: #e2876c;
      --accent-2: #c65f49;
      --wash: #292721;
      --card: #211f1c;
      --shadow: 0 20px 60px rgba(0, 0, 0, .24);
    }

    .load-state { min-height: 40vh; padding: 80px 0; }
    .load-state code { font-family: var(--sans); }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--serif); }
    button, a { color: inherit; }
    button { font: inherit; }
    a { text-decoration: none; }
    .shell { width: min(1440px, calc(100% - 40px)); margin: 0 auto; }
    .eyebrow { color: var(--accent); font: 700 10px/1 var(--sans); letter-spacing: .18em; text-transform: uppercase; }
    .sans { font-family: var(--sans); }
    .muted { color: var(--muted); }
    .rule { border-top: 1px solid var(--rule); }

    /* Shared chrome */
    .masthead { padding: 0 0 14px; border-bottom: 3px double var(--ink); }
    .section-heading, .story-meta, .detail-top, .footer-line { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .dateline { font: 700 10px var(--sans); letter-spacing: .14em; text-transform: uppercase; }
    .edition-date-nav { display: flex; align-items: center; gap: 12px; white-space: nowrap; }
    .edition-date-nav a, .editionrrow { color: var(--muted); font: 700 15px/1 var(--sans); }
    .edition-date-nav a:hover { color: var(--accent); }
    .editionrrow.disabled { color: var(--faint); }
    .sticky-header { position: sticky; top: 0; z-index: 20; display: grid; gap: 8px; padding: 9px 0; border-bottom: 1px solid var(--rule); background: var(--paper); }
    .sticky-header-top, .sticky-header-nav-row { display: flex; align-items: center; gap: 22px; min-width: 0; }
    .sticky-header-nav-row { gap: 16px; padding-top: 8px; border-top: 1px solid var(--rule); }
    .sticky-header-nav-row .sticky-nav { flex: 1 1 auto; }
    .sticky-header-nav-row .edition-date-nav { margin-left: auto; }
    .sticky-logo { flex: 0 0 auto; font-size: 22px; font-weight: 500; letter-spacing: -.045em; white-space: nowrap; }
    .sticky-logo:hover, .sticky-nav a:hover { color: var(--accent); }
    .sticky-nav { display: flex; align-items: center; gap: 15px; min-width: 0; overflow-x: auto; font: 11px var(--sans); }
    .sticky-nav a { color: var(--muted); white-space: nowrap; }
    .sticky-nav a.active { color: var(--accent); font-weight: 700; }
    .nav-mode { display: flex; flex: 0 0 auto; align-items: center; gap: 3px; margin-left: auto; padding: 3px; border: 1px solid var(--rule); border-radius: 999px; font: 10px var(--sans); }
    .nav-mode-label { padding: 0 5px 0 7px; color: var(--muted); }
    .nav-mode button { padding: 5px 8px; border: 0; border-radius: 999px; background: transparent; color: var(--muted); cursor: pointer; font: 700 10px var(--sans); }
    .nav-mode button.active, .nav-mode button:hover { background: var(--ink); color: var(--paper); }
    [data-content-group][hidden] { display: none; }
    #news, #sports, #finance, #teams, #events, #weekly { scroll-margin-top: 112px; }
    .forecast { display: grid; grid-template-columns: 1.15fr 2.85fr; gap: 14px; margin-top: 0; padding-top: 14px; border-top: 0; }
    .forecast-today, .forecast-day { min-height: 74px; padding: 10px 12px; background: var(--wash); }
    .forecast-today { display: flex; align-items: center; gap: 12px; }
    .forecast-icon { font-size: 27px; line-height: 1; }
    .forecast-temp { margin-top: 4px; font-size: 21px; }
    .forecast-copy { color: var(--muted); font: 10px/1.35 var(--sans); }
    .forecast-strip { display: grid; grid-template-columns: repeat(7, minmax(78px, 1fr)); gap: 6px; overflow-x: auto; }
    .forecast-day { min-width: 78px; }
    .forecast-day strong { display: block; margin: 8px 0 3px; font-size: 15px; font-weight: 500; }
    .forecast-day .forecast-icon { float: right; font-size: 18px; }
    .icon-btn, .text-btn { border: 1px solid var(--rule); background: transparent; cursor: pointer; }
    .icon-btn { width: 34px; height: 30px; border-radius: 50%; }
    .modal-close { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; padding: 3px; border: 1px solid var(--accent); border-radius: 50%; color: var(--ink); }
    .modal-close img { display: block; width: 20px; height: 20px; max-width: 20px; max-height: 20px; }
    .modal-close:hover { border-color: var(--accent); background: var(--accent); color: #fff; }
    .modal-close:hover img { filter: brightness(0) invert(1); }
    .text-btn { padding: 8px 11px; font: 700 10px var(--sans); letter-spacing: .08em; text-transform: uppercase; }
    .icon-btn:hover, .text-btn:hover { border-color: var(--accent); color: var(--accent); }
    .section { margin: 42px 0 0; }
    .section-heading { margin-bottom: 14px; }
    .section-heading h2 { margin: 0; font-size: 26px; font-weight: 500; letter-spacing: -.03em; }
    .sports-heading { align-items: center; gap: 14px; }
    .sports-heading h2 { flex: 0 0 auto; }
    .sports-heading-tools { display: flex; flex: 1 1 auto; align-items: center; gap: 10px; min-width: 0; }
    .sports-actions { display: flex; flex: 0 0 auto; align-items: center; gap: 7px; }
    .sports-action { display: inline-flex; align-items: center; justify-content: center; width: 42px; height: 42px; padding: 8px; border: 1px solid var(--rule); background: var(--wash); cursor: pointer; color: var(--ink); }
    .sports-action img { width: 25px; height: 25px; }
    .sports-action:hover { border-color: var(--accent); color: var(--accent); }
    .game-rail { position: relative; top: 5px; display: flex; flex: 1 1 auto; gap: 10px; min-width: 0; overflow-x: auto; padding: 0; scrollbar-width: thin; }
    .game-mini { display: flex; flex: 0 0 166px; align-items: center; height: 42px; min-height: 42px; padding: 5px; border: 1px solid var(--rule); background: var(--wash); cursor: pointer; text-align: left; }
    .game-mini:hover { border-color: var(--accent); color: var(--accent); }
    .game-mini-matchup { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0; width: 100%; font: 14px/1 var(--serif); }
    .game-mini-team { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .game-mini-score { grid-column: 2; font: inherit; font-weight: 700; }
    .sports-modal-list { display: grid; gap: 8px; margin: 20px 0; }
    .sports-modal-row { display: grid; grid-template-columns: 74px 1fr auto; gap: 10px; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--rule); }
    .sports-modal-row small { color: var(--muted); font: 10px/1.3 var(--sans); }
    .sports-modal-row strong { font-size: 16px; font-weight: 500; }
    .sports-modal-row span { color: var(--muted); font: 11px var(--sans); text-align: right; }
    .sports-modal-note { color: var(--muted); font: 11px/1.4 var(--sans); }
    .game-video { display: inline-block; margin-top: 15px; color: var(--accent); font: 700 11px var(--sans); letter-spacing: .06em; text-transform: uppercase; }
    .card-rail { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(220px, 1fr); gap: 12px; overflow-x: auto; padding: 3px 2px 10px; scroll-snap-type: x mandatory; }
    .card { min-height: 235px; padding: 17px; background: var(--card); border: 1px solid var(--rule); border-top: 3px solid var(--ink); display: flex; flex-direction: column; cursor: pointer; scroll-snap-align: start; transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease; }
    .card:hover { transform: translateY(-4px); border-color: var(--accent); box-shadow: var(--shadow); }
    .card .tag { color: var(--accent); font: 700 10px var(--sans); letter-spacing: .12em; text-transform: uppercase; }
    .finance-region { display: block; color: var(--accent); font: 700 10px var(--sans); letter-spacing: .12em; text-transform: uppercase; margin-bottom: 8px; }
    .card h3 { margin: 15px 0 10px; font-size: 21px; line-height: 1.05; font-weight: 500; }
    .card p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.42; }
    .card .story-meta { margin-top: auto; padding-top: 17px; color: var(--muted); font: 10px var(--sans); }
    .signal { display: inline-flex; align-items: center; gap: 5px; }
    .signal::before { content: ''; width: 6px; height: 6px; display: inline-block; border-radius: 50%; background: var(--accent); }
    .rollup { margin: 52px 0 0; padding: 25px 0 0; border-top: 3px double var(--ink); }
    .rollup-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; }
    .rollup h3 { margin: 8px 0; font-size: 27px; font-weight: 500; }
    .rollup p { margin: 0; color: var(--muted); font-size: 16px; line-height: 1.5; }
    .rollup-layout { display: grid; grid-template-columns: 1.15fr .85fr; gap: 32px; align-items: start; }
    .rollup-main h1 { margin: 8px 0 12px; max-width: 760px; font-size: clamp(42px, 6vw, 82px); line-height: .9; font-weight: 500; letter-spacing: -.065em; }
    .rollup-main p { max-width: 680px; font-size: 18px; }
    .rollup-cards { display: grid; gap: 12px; }
    .rollup-summary { padding: 17px; border: 1px solid var(--rule); background: var(--wash); }
    .rollup-summary h3 { margin: 6px 0 7px; font-size: 25px; font-weight: 500; }
    .rollup-summary p { font-size: 14px; line-height: 1.4; }
    .rollup-pulse { grid-column: 1 / -1; display: flex; align-items: baseline; gap: 20px; padding-top: 16px; border-top: 1px solid var(--rule); }
    .rollup-pulse-source { margin-left: auto; color: var(--muted); font: 700 10px var(--sans); letter-spacing: .12em; text-transform: uppercase; }
    .rollup-pulse-items { display: flex; flex-wrap: wrap; gap: 18px; color: var(--muted); font: 11px var(--sans); }
    .rollup-pulse-items strong { margin-right: 4px; color: var(--ink); font: 500 17px var(--serif); }
    .footer { margin: 65px 0 130px; padding-top: 14px; border-top: 1px solid var(--rule); color: var(--muted); font: 10px var(--sans); }

    /* Canonical broadsheet */
    .edition .card-rail { grid-auto-columns: minmax(235px, 1fr); }
    .edition .rollup { margin-top: 0; padding-top: 24px; padding-bottom: 24px; border-top: 0; border-bottom: 3px double var(--ink); }

    /* Modal and feedback */
    .modal-backdrop { position: fixed; inset: 0; z-index: 30; display: none; place-items: center; padding: 20px; background: rgba(15, 13, 11, .58); }
    .modal-backdrop.open { display: grid; }
    .modal { width: min(720px, 100%); max-height: min(760px, calc(100vh - 40px)); overflow: auto; padding: 27px; background: var(--paper); border: 1px solid var(--rule); box-shadow: 0 30px 100px rgba(0, 0, 0, .25); }
    .modal h2 { margin: 15px 0 12px; font-size: clamp(30px, 5vw, 52px); line-height: .95; font-weight: 500; letter-spacing: -.05em; }
    .modal-summary { color: var(--muted); font-size: 17px; line-height: 1.5; }
    .finance-meta { margin: 14px 0; padding: 10px 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); color: var(--muted); font: 12px/1.5 var(--sans); }
    .modal-copy { padding: 20px 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
    .modal-copy p { margin: 0 0 12px; font-size: 16px; line-height: 1.5; }
    .modal-copy p:last-child { margin-bottom: 0; }
    .evidence { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 18px 0; }
    .evidence div { padding: 10px; background: var(--wash); }
    .evidence strong { display: block; margin-top: 5px; font: 700 11px var(--sans); }
    .sources { margin-top: 20px; }
    .sources a { display: block; padding: 8px 0; border-bottom: 1px solid var(--rule); color: var(--accent); font: 12px var(--sans); }
    .feedback { display: flex; gap: 8px; align-items: center; margin-top: 22px; padding-top: 15px; border-top: 1px solid var(--rule); }
    .feedback span { margin-right: auto; color: var(--muted); font: 11px var(--sans); }
    .toast { position: fixed; right: 18px; bottom: 18px; z-index: 45; max-width: 280px; padding: 12px 14px; color: var(--paper); background: var(--ink); border-left: 3px solid var(--accent); font: 12px/1.4 var(--sans); opacity: 0; transform: translateY(10px); transition: .2s; pointer-events: none; }
    .toast.show { opacity: 1; transform: translateY(0); }

    @media (max-width: 780px) {
      .shell { width: min(100% - 24px, 640px); }
      .masthead-top { align-items: flex-start; }
      .sticky-header-top, .sticky-header-nav-row { gap: 10px; }
      .sticky-header-nav-row { display: grid; gap: 7px; }
      .sticky-header-nav-row .sticky-nav { order: 1; width: 100%; }
      .sticky-header-nav-row .edition-date-nav { order: 2; justify-content: center; width: 100%; margin-left: 0; }
      .sticky-header-nav-row .edition-date-nav { gap: 7px; }
      .sticky-header-nav-row .edition-date-nav .dateline { font-size: 9px; letter-spacing: .08em; }
      .sticky-nav { padding-bottom: 2px; }
      .nav-mode { margin-left: auto; }
      .forecast { display: flex; gap: 6px; overflow-x: auto; padding-top: 10px; }
      .forecast-today { flex: 0 0 145px; min-height: 58px; padding: 7px 8px; }
      .forecast-today .forecast-icon { font-size: 21px; }
      .forecast-today .forecast-temp { font-size: 16px; }
      .forecast-today .forecast-copy, .forecast-day .forecast-copy { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .forecast-strip { display: flex; flex: 0 0 auto; gap: 6px; overflow: visible; padding-bottom: 0; }
      .forecast-day { flex: 0 0 70px; min-width: 70px; min-height: 58px; padding: 7px 8px; }
      .forecast-day strong { margin: 5px 0 2px; font-size: 13px; }
      .forecast-day .forecast-icon { font-size: 16px; }
      .evidence { grid-template-columns: 1fr; }
      .modal-backdrop { padding: 0; place-items: stretch; }
      .modal { width: 100%; height: 100%; max-height: none; padding: 22px 16px; border: 0; }
      .rollup-layout { display: block; }
      .rollup-cards { margin-top: 22px; }
      .rollup-pulse { display: block; }
      .rollup-pulse-source { margin: 10px 0 0; }
      .rollup-pulse-items { margin-top: 10px; }
      .sports-heading { display: block; }
      .sports-heading-tools { margin-top: 12px; }
      .sports-action { width: 38px; height: 38px; padding: 7px; }
      .sports-action img { width: 23px; height: 23px; }
      .game-rail { overflow-x: auto; }
      .game-mini { flex-basis: 155px; }
    }
  </style>
</head>
<body>
  <main id="app"></main>
  <div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true" aria-label="Story detail">
    <article class="modal" id="modal"></article>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    // Canonical broadsheet edition.
    let edition = null;

    let activeTheme = localStorage.getItem('daily-report-theme') || 'light';
    let navMode = 'scroll';
    let activeFilter = 'all';
    document.documentElement.dataset.theme = activeTheme;

    function navLinks() {
      return `<a href="#news" data-nav-target="all">Today</a><a href="#sports" data-nav-target="sports">Sports</a><a href="#finance" data-nav-target="finance">Finance</a><a href="#teams" data-nav-target="teams">My teams</a><a href="#events" data-nav-target="events">Events</a><a href="#weekly" data-nav-target="weekly">Week</a><a href="#monthly" data-nav-target="monthly">Month</a>`;
    }

    function shiftDate(dateISO, offset) {
      const date = new Date(`${dateISO}T12:00:00Z`);
      date.setUTCDate(date.getUTCDate() + offset);
      return date.toISOString().slice(0, 10);
    }

    function archiveHref(dateISO) {
      return 'index.html?date=' + dateISO.replaceAll('-', '');
    }

    function editionDateNav() {
      const previousDate = edition.previousEdition || shiftDate(edition.dateISO, -1);
      const nextDate = shiftDate(edition.dateISO, 1);
      return `<div class="edition-date-nav" aria-label="Edition date navigation"><a href="${archiveHref(previousDate)}" aria-label="Previous edition">&larr;</a><span class="dateline">${edition.date} &middot; ${edition.time}</span><span class="editionrrow disabled" data-next-edition data-next-date="${nextDate}" aria-label="Checking for next edition">&rarr;</span></div>`;
    }

    async function refreshNextEditionNav() {
      const placeholder = document.querySelector('[data-next-edition]');
      if (!placeholder) return;
      try {
        const response = await fetch('./data-' + placeholder.dataset.nextDate.replaceAll('-', '') + '.json', { cache: 'no-store' });
        if (!response.ok) return;
        const link = document.createElement('a');
        link.href = archiveHref(placeholder.dataset.nextDate);
        link.setAttribute('aria-label', 'Next edition');
        link.innerHTML = '&rarr;';
        placeholder.replaceWith(link);
      } catch (error) {
        // A missing next-day JSON file means this is the latest available edition.
      }
    }

    function navModeMarkup() {
      return `<div class="nav-mode" aria-label="Navigation mode"><span class="nav-mode-label">View</span><button type="button" data-nav-mode="scroll" aria-pressed="true">Scroll</button><button type="button" data-nav-mode="filter" aria-pressed="false">Filter</button></div>`;
    }

    function stickyHeaderMarkup() {
      return `<div class="sticky-header"><div class="sticky-header-top"><a class="sticky-logo" href="#top">The Daily Report</a>${navModeMarkup()}<button class="icon-btn sticky-theme" type="button" data-theme-toggle aria-label="Toggle light and dark mode">${activeTheme === 'light' ? 'â˜¾' : 'â˜¼'}</button></div><div class="sticky-header-nav-row"><nav class="sticky-nav" aria-label="Sticky edition navigation">${navLinks()}</nav>${editionDateNav()}</div></div>`;
    }

    function header() {
      return `${stickyHeaderMarkup()}<header class="masthead">
        <div class="forecast" aria-label="Today and seven-day forecast">
          <div class="forecast-today"><span class="forecast-icon">${edition.forecastToday[0]}</span><div><div class="eyebrow">Today in Valencia</div><div class="forecast-temp">${edition.forecastToday[1]}</div><div class="forecast-copy">${edition.forecastToday[2]}</div></div></div>
          <div class="forecast-strip">${edition.forecast.map(([day, icon, temp, condition]) => `<div class="forecast-day"><span class="forecast-icon">${icon}</span><div class="eyebrow">${day}</div><strong>${temp}</strong><div class="forecast-copy">${condition}</div></div>`).join('')}</div>
        </div>
      </header>`;
    }

    function cardMarkup(card) {
      const financeLabel = card.type === 'Finance' && card.region ? `<span class="finance-region">${card.region}</span>` : '';
      return `<article class="card" tabindex="0" role="button" data-card-id="${card.id}">
        ${financeLabel}
        <span class="tag">${card.type} Â· ${card.section}</span>
        <h3>${card.title}</h3>
        <p>${card.summary}</p>
        <div class="story-meta"><span class="signal">${card.status}</span><span>${card.timestamp} Â· ${card.confidence} confidence</span></div>
      </article>`;
    }

    const mockSportsPairs = {
      'NBA': ['Golden State Warriors', 'Charlotte Hornets'],
      'EuroLeague': ['Valencia Basket', 'Fenerbahce Beko'],
      'Spanish basketball': ['Valencia Basket', 'Unicaja'],
      'Formula 1': ['McLaren', 'Ferrari'],
      'IndyCar': ['Team Penske', 'Chip Ganassi Racing'],
      'NFL': ['Kansas City Chiefs', 'Buffalo Bills'],
      'College football': ['Ohio State Buckeyes', 'Michigan Wolverines'],
      'MLS': ['Columbus Crew', 'Atlanta United'],
      'La Liga': ['Real Madrid', 'Valencia CF'],
      'Premier League': ['Manchester City', 'Arsenal'],
      'Ohio State football': ['Ohio State Buckeyes', 'Michigan Wolverines'],
      'Manchester City': ['Manchester City', 'Liverpool'],
      'Real Madrid': ['Real Madrid', 'Barcelona'],
      'Valencia Basket': ['Valencia Basket', 'Baskonia'],
      'Columbus Crew': ['Columbus Crew', 'Atlanta United']
    };

    const mockYouTubeSources = {
      'NBA': 'https://www.youtube.com/@NBA',
      'MLS': 'https://www.youtube.com/@mls',
      'NFL': 'https://www.youtube.com/@NFL',
      'La Liga': 'https://www.youtube.com/@LALIGAHYPERMOTION',
      'Premier League': 'https://www.youtube.com/@premierleague',
      'Formula 1': 'https://www.youtube.com/@Formula1',
      'IndyCar': 'https://www.youtube.com/@indycar',
      'EuroLeague': 'https://www.youtube.com/@euroleague',
      'Spanish basketball': 'https://www.youtube.com/@acbcom',
      'Manchester City': 'https://www.youtube.com/@premierleague',
      'Real Madrid': 'https://www.youtube.com/@LALIGAHYPERMOTION',
      'Valencia Basket': 'https://www.youtube.com/@acbcom',
      'Columbus Crew': 'https://www.youtube.com/@mls'
    };

    function formatSportsDate(dateISO) {
      return new Intl.DateTimeFormat('en-US', {
        timeZone: 'Europe/Madrid',
        weekday: 'short',
        month: 'short',
        day: 'numeric'
      }).format(new Date(dateISO + 'T12:00:00Z'));
    }

    const mockFootballTeams = {
      'NFL': ['Kansas City Chiefs', 'Buffalo Bills', 'Miami Dolphins', 'New York Jets', 'Baltimore Ravens', 'Cincinnati Bengals'],
      'College football': ['Ohio State Buckeyes', 'Michigan Wolverines', 'Penn State Nittany Lions', 'Oregon Ducks', 'Texas Longhorns', 'Notre Dame Fighting Irish'],
      'MLS': ['Columbus Crew', 'Atlanta United', 'Inter Miami', 'New York City FC', 'LA Galaxy', 'Seattle Sounders'],
      'La Liga': ['Real Madrid', 'Valencia CF', 'Barcelona', 'Atlético Madrid', 'Sevilla', 'Real Betis'],
      'Premier League': ['Manchester City', 'Arsenal', 'Liverpool', 'Chelsea', 'Manchester United', 'Tottenham Hotspur']
    };

    function createMockGame(section, home, away, dateISO, index, status, label) {
      const final = status === 'Final';
      const homeScore = final ? String((index % 3) + 1) : '';
      const awayScore = final ? String((index % 2) + 1) : '';
      return {
        id: section.id + '-game-' + index,
        dateISO,
        date: formatSportsDate(dateISO),
        time: final ? '' : (index % 2 ? '20:00 CEST' : '19:30 CEST'),
        home,
        away,
        matchup: final ? home + ' · ' + away : home + ' vs ' + away,
        score: final ? homeScore + '–' + awayScore : '—',
        homeScore,
        awayScore,
        status,
        label,
        venue: index % 2 ? 'Mock Stadium' : 'Mock Arena',
        summary: final ? 'Mock recap: ' + home + ' controlled the key moments against ' + away + '.' : 'Mock schedule entry for the ' + label.toLowerCase() + '.',
        stats: final ? ['Possession / control: ' + (52 + index) + '%', 'Attempts: ' + (12 + index) + '–' + (9 + index), 'Turning point: late ' + (index % 2 ? 'equalizer' : 'adjustment')] : ['Scheduled start: ' + (index % 2 ? '20:00 CEST' : '19:30 CEST'), 'Venue: Mock ' + (index % 2 ? 'Stadium' : 'Arena'), 'Broadcast: confirmation pending'],
        ...(final ? { videoUrl: mockYouTubeSources[section.name] || 'https://www.youtube.com/watch?v=aqz-KE-bpKQ', videoLabel: mockYouTubeSources[section.name] ? 'Official league YouTube channel' : 'Mock YouTube recap' } : {})
      };
    }

    function sportsGames(sports) {
      return sports.games || [...(sports.recent || []), ...(sports.upcoming || [])];
    }

    function mockSportsData(section) {
      const pair = mockSportsPairs[section.name] || [section.name, 'Visiting side'];
      const base = edition.dateISO || '2026-08-17';
      let recent;
      let upcoming;

      if (section.name === 'NBA') {
        const opponents = ['Charlotte Hornets', 'Boston Celtics', 'New York Knicks', 'Los Angeles Lakers', 'Phoenix Suns', 'Dallas Mavericks'];
        recent = opponents.map((opponent, index) => createMockGame(section, pair[0], opponent, shiftDate(base, -1), index, 'Final', 'Previous night'));
        upcoming = [createMockGame(section, pair[0], pair[1], shiftDate(base, 2), 6, 'Upcoming', 'Next game')];
      } else if (section.name === 'Formula 1' || section.name === 'IndyCar') {
        recent = [createMockGame(section, pair[0], pair[1], shiftDate(base, -7), 0, 'Final', 'Previous race')];
        upcoming = [createMockGame(section, pair[1], pair[0], shiftDate(base, 7), 1, 'Upcoming', 'Upcoming race')];
      } else if (mockFootballTeams[section.name]) {
        const teams = mockFootballTeams[section.name];
        const matchday = Array.from({ length: 6 }, (_, index) => createMockGame(section, teams[index], teams[(index + 1) % teams.length], shiftDate(base, index < 4 ? -1 : 1), index, index < 4 ? 'Final' : 'Upcoming', 'Matchday'));
        recent = matchday.filter(game => game.status === 'Final');
        upcoming = matchday.filter(game => game.status === 'Upcoming');
      } else {
        recent = [0, 1, 2].map(index => createMockGame(section, index ? pair[1] : pair[0], index ? pair[0] : pair[1], shiftDate(base, -1), index, 'Final', 'Yesterday'));
        upcoming = [createMockGame(section, pair[0], pair[1], shiftDate(base, 2), 3, 'Upcoming', 'Next game'), createMockGame(section, pair[1], pair[0], shiftDate(base, 5), 4, 'Upcoming', 'Upcoming')];
      }

      const games = [...recent, ...upcoming];
      return {
        recent,
        upcoming,
        games,
        standings: [pair[0], pair[1], 'Northside Athletic', 'Riverside Club', 'Capital United'].map((team, index) => ({
          rank: index + 1,
          team,
          record: (8 - index) + '–' + (2 + index),
          form: index < 2 ? 'W W D' : 'W L W'
        })),
        schedule: games.filter(game => game.status === 'Upcoming').map(game => ({
          date: game.date,
          time: game.time,
          matchup: game.matchup,
          venue: game.venue
        })),
        isMock: true
      };
    }

    function sportsData(section) {
      return section.sports || mockSportsData(section);
    }

    function sportsHeaderMarkup(section) {
      const sports = sportsData(section);
      const games = sportsGames(sports);
      return '<div class="sports-heading-tools">' +
        '<div class="sports-actions"><button class="sports-action" type="button" data-sports-modal="standings" data-section-id="' + section.id + '" aria-label="Open standings"><img src="assets/table.svg" alt=""></button><button class="sports-action" type="button" data-sports-modal="schedule" data-section-id="' + section.id + '" aria-label="Open upcoming schedule"><img src="assets/calendar.svg" alt=""></button></div>' +
        '<div class="game-rail" aria-label="Recent and upcoming games">' + games.map(game => {
          const teams = game.home && game.away ? [game.home, game.away] : game.matchup.split(game.matchup.includes(' vs ') ? ' vs ' : ' · ');
          const scores = game.homeScore !== undefined ? [game.homeScore, game.awayScore] : (game.score || '').split('–');
          return '<article class="game-mini" role="button" tabindex="0" data-game-id="' + game.id + '" data-section-id="' + section.id + '" aria-label="Open ' + game.status.toLowerCase() + ' game">' +
            '<div class="game-mini-matchup"><span class="game-mini-team">' + teams[0] + '</span><strong class="game-mini-score">' + (scores[0] || '—') + '</strong><span class="game-mini-team">' + teams[1] + '</span><strong class="game-mini-score">' + (scores[1] || '—') + '</strong></div>' +
          '</article>';
        }).join('') + '</div>' +
      '</div>';
    }

    function sectionMarkup(section) {
      const isSports = section.type === 'Sports' || section.type === 'Followed club';
      return '<section class="section' + (isSports ? ' sports-section' : '') + '" id="' + section.id + '">' +
        '<div class="section-heading' + (isSports ? ' sports-heading' : '') + '"><h2>' + section.name + '</h2>' + (isSports ? sportsHeaderMarkup(section) : '') + '</div>' +
        '<div class="card-rail">' + section.cards.map(cardMarkup).join('') + '</div>' +
      '</section>';
    }

    function rollupMarkup(hero = false) {
      return `<section class="rollup${hero ? ' hero-rollup' : ''}" id="weekly"><div class="eyebrow">The midnight desk &middot; Editor&apos;s rollup</div>${hero ? `<div class="rollup-layout"><div class="rollup-main"><h1>Twenty-five minutes of useful context.</h1><p>${edition.newsRollup}</p><p class="rollup-finance">${edition.financeRollup}</p></div><div class="rollup-cards"><article class="rollup-summary"><div class="eyebrow">News summary</div><h3>News in one sitting</h3><p>${edition.newsRollup}</p></article><article class="rollup-summary"><div class="eyebrow">Sports summary</div><h3>Sports in one sitting</h3><p>${edition.sportsRollup}</p></article></div><div class="rollup-pulse"><div class="eyebrow">Edition pulse</div><div class="rollup-pulse-items"><span><strong>${edition.pulse.desks}</strong> desks</span><span><strong>${edition.pulse.cards}</strong> cards</span><span><strong>${edition.pulse.sources}</strong> sources</span><span><strong>${edition.pulse.liveClaims}</strong> live claims</span></div><span class="rollup-pulse-source">No. 001 / Live sources</span></div></div>` : ''}${hero ? '' : `<div class="rollup-grid"><div><h3>News in one sitting</h3><p>${edition.newsRollup}</p></div><div><h3>Sports in one sitting</h3><p>${edition.sportsRollup}</p></div></div>`}</section>`;
    }

    function footer() {
      return `<footer class="footer"><div class="footer-line"><span>THE DAILY REPORT Â· STATIC EDITION</span><span>Generated from bounded reporter passes Â· live source links</span></div></footer>`;
    }

    function renderEdition() {
      const news = edition.sections.filter(s => s.type === 'News');
      const sports = edition.sections.filter(s => s.type === 'Sports');
      const finance = edition.sections.filter(s => s.type === 'Finance');
      const teams = edition.sections.filter(s => s.type === 'Followed club');
      const events = edition.sections.filter(s => s.type === 'Events');
      return `<div class="shell edition" id="top">${header()}${rollupMarkup(true)}<div id="news" data-content-group="news">${news.map(sectionMarkup).join('')}</div><div id="sports" data-content-group="sports">${sports.map(sectionMarkup).join('')}</div><div id="finance" data-content-group="finance">${finance.map(sectionMarkup).join('')}</div><div id="teams" data-content-group="teams">${teams.map(sectionMarkup).join('')}</div><div id="events" data-content-group="events">${events.map(sectionMarkup).join('')}</div>${footer()}</div>`;
    }

    function render() {
      document.getElementById('app').innerHTML = renderEdition();
      bindInteractions();
      refreshNextEditionNav();
    }

    function openCard(id) {
      const card = edition.sections.flatMap(section => section.cards).find(item => item.id === id);
      if (!card) return;
      document.getElementById('modal').innerHTML = `<div class="detail-top"><span class="eyebrow">${card.type} Â· ${card.section}</span><button class="icon-btn modal-close" type="button" data-close aria-label="Close story"><img src="assets/close.svg" alt=""></button></div><h2>${card.title}</h2><p class="modal-summary">${card.summary}</p><div class="evidence"><div><span class="eyebrow">Status</span><strong>${card.status}</strong></div><div><span class="eyebrow">Confidence</span><strong>${card.confidence}</strong></div><div><span class="eyebrow">Why here</span><strong>${card.why}</strong></div></div><div class="modal-copy">${card.detail.map(paragraph => `<p>${paragraph}</p>`).join('')}</div><div class="sources"><div class="eyebrow">Bibliography / source mix</div>${card.sources.map(source => `<a href="${source.url}" target="_blank" rel="noreferrer" >${source.label} Â· ${source.name} â†—</a>`).join('')}</div><div class="feedback"><span>Was this useful or accurate?</span><button class="text-btn" type="button" data-feedback="up">Thumbs up</button><button class="text-btn" type="button" data-feedback="down">Thumbs down</button></div>`;
      if (card.type === 'Finance') {
        const meta = document.createElement('div');
        meta.className = 'finance-meta';
        meta.textContent = `${card.region} Â· As of ${card.as_of} Â· ${card.instruments.join(', ')} Â· ${card.movement}`;
        document.getElementById('modal').querySelector('.modal-summary').after(meta);
      }
      document.getElementById('modalBackdrop').classList.add('open');
    }

    function sportsSection(sectionId) {
      return edition.sections.find(section => section.id === sectionId);
    }

    function openGameModal(sectionId, gameId) {
      const section = sportsSection(sectionId);
      if (!section) return;
      const sports = sportsData(section);
      const game = sportsGames(sports).find(item => item.id === gameId);
      if (!game) return;
      const stats = (game.stats || []).map(item => '<p>' + item + '</p>').join('');
      const video = game.videoUrl
        ? '<a class="game-video" href="' + game.videoUrl + '" target="_blank" rel="noreferrer">' + (game.videoLabel || 'Watch game recap on YouTube') + ' ↗</a>'
        : '';
      document.getElementById('modal').innerHTML =
        '<div class="detail-top"><span class="eyebrow">' + section.name + ' · ' + game.status + '</span><button class="icon-btn modal-close" type="button" data-close aria-label="Close game detail"><img src="assets/close.svg" alt=""></button></div>' +
        '<h2>' + game.matchup + '</h2><p class="modal-summary">' + game.summary + '</p>' +
        '<div class="evidence"><div><span class="eyebrow">Date</span><strong>' + game.date + '</strong></div><div><span class="eyebrow">Score</span><strong>' + game.score + '</strong></div><div><span class="eyebrow">Venue</span><strong>' + game.venue + '</strong></div></div>' +
        '<div class="modal-copy">' + stats + '</div>' + video +
        '<p class="sports-modal-note">Mock sports data for the UI prototype. Scores, stats, schedules, and video links are placeholders.</p>';
      document.getElementById('modalBackdrop').classList.add('open');
    }

    function openSportsListModal(sectionId, kind) {
      const section = sportsSection(sectionId);
      if (!section) return;
      const sports = sportsData(section);
      const title = kind === 'standings' ? 'Current standings' : 'Upcoming schedule';
      const rows = kind === 'standings'
        ? sports.standings.map(row => '<div class="sports-modal-row"><small>#' + row.rank + '</small><strong>' + row.team + '</strong><span>' + row.record + ' · ' + row.form + '</span></div>').join('')
        : sports.schedule.map(game => '<div class="sports-modal-row"><small>' + game.date + '<br>' + game.time + '</small><strong>' + game.matchup + '</strong><span>' + game.venue + '</span></div>').join('');
      document.getElementById('modal').innerHTML =
        '<div class="detail-top"><span class="eyebrow">' + section.name + ' · Mock data</span><button class="icon-btn modal-close" type="button" data-close aria-label="Close sports panel"><img src="assets/close.svg" alt=""></button></div>' +
        '<h2>' + title + '</h2><p class="modal-summary">A compact prototype panel for the sport-specific reference view.</p>' +
        '<div class="sports-modal-list">' + rows + '</div><p class="sports-modal-note">Mock sports data for the UI prototype. The final version will use confirmed league, team, and competition sources.</p>';
      document.getElementById('modalBackdrop').classList.add('open');
    }

    function closeModal() { document.getElementById('modalBackdrop').classList.remove('open'); }
    function showToast(message) { const toast = document.getElementById('toast'); toast.textContent = message; toast.classList.add('show'); clearTimeout(showToast.timer); showToast.timer = setTimeout(() => toast.classList.remove('show'), 2400); }
    function applyNavigation() {
      document.querySelectorAll('[data-content-group]').forEach(group => {
        group.hidden = navMode === 'filter' && activeFilter !== 'all' && group.dataset.contentGroup !== activeFilter;
      });
      document.querySelectorAll('[data-nav-mode]').forEach(button => {
        const isActive = button.dataset.navMode === navMode;
        button.classList.toggle('active', isActive);
        button.setAttribute('aria-pressed', isActive ? 'true' : 'false');
      });
      document.querySelectorAll('[data-nav-target]').forEach(link => {
        link.classList.toggle('active', navMode === 'filter' && link.dataset.navTarget === activeFilter);
      });
    }
    function handleNavigation(link, event) {
      const target = link.dataset.navTarget;
      if (navMode === 'filter') {
        event.preventDefault();
        if (['all', 'news', 'sports', 'finance', 'teams', 'events'].includes(target)) {
          activeFilter = target;
          applyNavigation();
          if (target === 'all') window.scrollTo({ top: 0, behavior: 'smooth' });
          else document.getElementById(target)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
        } else if (target === 'weekly') {
          activeFilter = 'all';
          applyNavigation();
          document.getElementById('weekly')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
        } else {
          showToast('Monthly summary is mocked for now.');
        }
      } else if (target === 'monthly') {
        event.preventDefault();
        showToast('Monthly summary is mocked for now.');
      }
    }
    function setTheme(theme) {
      activeTheme = theme;
      document.documentElement.dataset.theme = activeTheme;
      localStorage.setItem('daily-report-theme', activeTheme);
      document.querySelectorAll('[data-theme-toggle]').forEach(button => {
        button.textContent = activeTheme === 'light' ? 'â˜¾' : 'â˜¼';
      });
    }

    function handleAppClick(event) {
      const themeButton = event.target.closest('[data-theme-toggle]');
      if (themeButton) {
        event.preventDefault();
        setTheme(activeTheme === 'light' ? 'dark' : 'light');
        return;
      }
      const modeButton = event.target.closest('[data-nav-mode]');
      if (modeButton) {
        event.preventDefault();
        navMode = modeButton.dataset.navMode;
        if (navMode === 'scroll') activeFilter = 'all';
        applyNavigation();
        return;
      }
      const sportsAction = event.target.closest('[data-sports-modal]');
      if (sportsAction) {
        event.preventDefault();
        openSportsListModal(sportsAction.dataset.sectionId, sportsAction.dataset.sportsModal);
        return;
      }
      const link = event.target.closest('[data-nav-target]');
      if (link) {
        handleNavigation(link, event);
        return;
      }
      const game = event.target.closest('[data-game-id]');
      if (game) {
        openGameModal(game.dataset.sectionId, game.dataset.gameId);
        return;
      }
      const card = event.target.closest('[data-card-id]');
      if (card) openCard(card.dataset.cardId);
    }

    function handleAppKeydown(event) {
      const game = event.target.closest('[data-game-id]');
      if (game && (event.key === 'Enter' || event.key === ' ')) {
        event.preventDefault();
        openGameModal(game.dataset.sectionId, game.dataset.gameId);
        return;
      }
      const card = event.target.closest('[data-card-id]');
      if (card && (event.key === 'Enter' || event.key === ' ')) {
        event.preventDefault();
        openCard(card.dataset.cardId);
      }
    }

    function bindInteractions() {
      const app = document.getElementById('app');
      app.addEventListener('click', handleAppClick);
      app.addEventListener('keydown', handleAppKeydown);
      applyNavigation();
    }

    document.addEventListener('keydown', event => { if (event.key === 'Escape') closeModal(); });
    document.getElementById('modalBackdrop').addEventListener('click', event => { if (event.target.id === 'modalBackdrop') closeModal(); });
    document.getElementById('modal').addEventListener('click', event => { const close = event.target.closest('[data-close]'); const feedback = event.target.closest('[data-feedback]'); if (close) closeModal(); if (feedback) showToast(feedback.dataset.feedback === 'up' ? 'Saved: useful / accurate.' : 'Saved: needs review.'); });

    async function loadEdition() {
      const parts = new Intl.DateTimeFormat('en-GB', {
        timeZone: 'Europe/Madrid',
        year: 'numeric',
        month: '2-digit',
        day: '2-digit'
      }).formatToParts(new Date());
      const values = Object.fromEntries(parts.map(part => [part.type, part.value]));
      const dateKey = new URLSearchParams(location.search).get('date') || (values.year + values.month + values.day);
      const file = 'data-' + dateKey + '.json';
      document.getElementById('app').innerHTML = '<div class="shell load-state"><p class="eyebrow">Dynamic edition loader</p><h1>Loading ' + file + '</h1><p>Fetching the dated reporter output...</p></div>';
      try {
        const response = await fetch('./' + file, { cache: 'no-store' });
        if (!response.ok) throw new Error(response.status + ' ' + response.statusText);
        edition = await response.json();
        document.title = 'The Daily Report · ' + edition.date;
        render();
      } catch (error) {
        document.getElementById('app').innerHTML = '<div class="shell load-state"><p class="eyebrow">Dynamic edition loader</p><h1>Edition unavailable</h1><p>' + error.message + '</p><p>Expected <code>' + file + '</code> beside this page.</p></div>';
      }
    }

    loadEdition();
  </script>
</body>
</html>
